name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  policies:
    name: Azure Policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # az is preinstalled on the runner and ships a managed bicep - more robust
      # than fetching the release binary, and it restores the remote AVM module.
      - name: install bicep via az
        run: az bicep install
      - name: compile
        run: az bicep build --file bicep/keyvault.bicep --outfile /dev/stdout
